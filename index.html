<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1023">
  <meta name="description" content="اكتشف منصة سديم Nebula: مساحة عربية للقوالب الذكية، وتطوير التطبيقات، ومعالجة البورتريه.">
  <title>سديم Nebula | من الفكرة إلى التطبيق</title>

  <style>
    :root {
      --primary: #2458e8;
      --ink: #182139;
      --muted: #667085;
      --line: #e5eaf3;
      --surface: #ffffff;
      --background: #f6f8fc;
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      color: var(--ink);
      background-color: var(--background);
      background-image:
        radial-gradient(circle at 88% 8%, rgba(36, 88, 232, 0.11), transparent 36%),
        radial-gradient(circle at 12% 38%, rgba(118, 58, 207, 0.08), transparent 40%),
        radial-gradient(circle at 85% 75%, rgba(23, 119, 94, 0.06), transparent 38%),
        linear-gradient(to right, rgba(36, 88, 232, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(36, 88, 232, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 100% 100%, 36px 36px, 36px 36px;
      line-height: 1.8;
    }

    a { color: inherit; text-decoration: none; }
    h1, h2, h3, p, figure { margin: 0; }

    .container {
      width: min(1160px, calc(100% - 40px));
      margin-inline: auto;
    }

    /* شريط التنقل */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }

    .header-content {
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .brand-logo-img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      border-radius: 12px;
      background: #0b1023;
      padding: 4px;
      box-shadow: 0 4px 12px rgba(11, 16, 35, 0.15);
    }

    .brand-name { display: grid; line-height: 1.4; }
    .brand-name strong { font-size: 22px; }
    .brand-name small { color: var(--primary); font-size: 11px; font-weight: bold; }

    nav { display: flex; align-items: center; gap: 24px; }
    nav a { color: var(--muted); font-size: 14px; font-weight: bold; }

    .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      min-height: 48px;
      padding: 11px 22px;
      border: 1px solid transparent;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-primary {
      color: white;
      background: linear-gradient(135deg, #2458e8, #1d4ed8);
      box-shadow: 0 4px 14px rgba(36, 88, 232, 0.25);
    }

    .btn-secondary {
      color: white;
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.25);
    }

    /* القسم الرئيسي */
    .hero {
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1.08fr 1fr;
      align-items: center;
      gap: 48px;
      margin-top: 30px;
      padding: 55px 44px;
      border: 1px solid #293455;
      border-radius: 30px;
      color: white;
      background-color: #070a14;
      background-image:
        radial-gradient(ellipse at 10% 15%, rgba(118, 58, 207, 0.4), transparent 48%),
        radial-gradient(ellipse at 85% 90%, rgba(36, 88, 232, 0.4), transparent 52%),
        radial-gradient(rgba(255, 255, 255, 0.12) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 28px 28px;
      box-shadow: 0 20px 50px rgba(11, 16, 35, 0.2);
    }

    .hero-copy, .preview { position: relative; }

    .hero-logo-banner {
      max-width: 240px;
      height: auto;
      display: block;
      margin-bottom: 18px;
      border-radius: 14px;
      mix-blend-mode: lighten;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 6px 13px;
      margin-bottom: 18px;
      color: #c7d6ff;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 100px;
      background: rgba(255, 255, 255, 0.06);
      font-size: 12px;
    }

    .eyebrow::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #72dfbc;
      box-shadow: 0 0 12px #72dfbc;
    }

    h1 {
      font-size: clamp(30px, 4vw, 48px);
      line-height: 1.35;
      margin-bottom: 18px;
    }

    .gradient-text {
      color: #a9bfff;
      background: linear-gradient(90deg, #c4b5fd, #7dd3fc);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-description {
      color: #c0c9df;
      font-size: 15px;
      line-height: 1.9;
      max-width: 510px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 26px;
    }

    .hero-note {
      margin-top: 18px;
      color: #a7b3cc;
      font-size: 12px;
    }

    /* معاينة واجهة المنصة */
    .preview {
      min-width: 0;
      padding: 10px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 20px;
      box-shadow: 0 28px 65px rgba(0, 0, 0, 0.45);
    }

    .window-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 6px 13px;
      color: #b5bfd5;
      font-size: 10px;
    }

    .window-dots { display: flex; gap: 5px; direction: ltr; }
    .window-dots i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #72809d;
    }
    .window-dots i:first-child { background: #f38491; }
    .window-dots i:nth-child(2) { background: #f5ca7c; }
    .window-dots i:last-child { background: #6dd9b6; }

    .dashboard {
      padding: 17px;
      background: #f5f7fc;
      color: var(--ink);
      border-radius: 12px;
    }

    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      font-size: 11px;
    }

    .dashboard-header strong { color: var(--primary); }
    .dashboard-header span { color: var(--muted); font-size: 9px; }

    .dashboard-banner {
      position: relative;
      overflow: hidden;
      padding: 25px 18px;
      border-radius: 12px;
      background:
        radial-gradient(circle at 0% 0%, #65429c, transparent 70%),
        #10162d;
      color: white;
    }

    .dashboard-banner::after {
      content: "✦";
      position: absolute;
      left: 13px;
      top: -17px;
      font-size: 115px;
      color: rgba(255, 255, 255, 0.08);
    }

    .dashboard-banner small { color: #b8c8ff; font-size: 9px; }
    .dashboard-banner h3 { margin: 6px 0; font-size: 18px; }
    .dashboard-banner p { color: #c1c9dc; font-size: 10px; }

    .dashboard-tools {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-block: 12px;
    }

    .mini-tool {
      display: grid;
      justify-items: center;
      gap: 7px;
      padding: 13px 4px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 10px;
      font-weight: bold;
    }

    .mini-tool b {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: #edf2ff;
      color: var(--primary);
      font-size: 16px;
    }

    .project-box {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: white;
      font-size: 10px;
    }

    .project-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 10px;
      padding-top: 9px;
      border-top: 1px solid #edf0f6;
      color: var(--muted);
    }

    .project-row span:last-child { color: var(--primary); font-weight: bold; }

    .preview figcaption {
      padding-top: 9px;
      text-align: center;
      color: #aebbd7;
      font-size: 10px;
    }

    /* شريط تعريفي */
    .highlights {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 16px 36px;
      padding: 27px 10px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
      font-weight: bold;
    }

    .highlights span::before {
      content: "✓";
      color: var(--primary);
      font-weight: bold;
      margin-left: 8px;
    }

    /* الأقسام */
    section { padding-block: 60px; }

    .section-heading {
      max-width: 620px;
      margin: 0 auto 36px;
      text-align: center;
    }

    .section-label {
      display: block;
      color: var(--primary);
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 9px;
    }

    .section-heading h2 {
      font-size: clamp(24px, 3vw, 34px);
      line-height: 1.4;
      margin-bottom: 12px;
    }

    .section-heading p { color: var(--muted); font-size: 14px; }

    .features-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .feature {
      padding: 27px;
      background: linear-gradient(180deg, #ffffff 0%, #fafbff 100%);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 6px 20px rgba(24, 33, 57, 0.03);
    }

    .feature-icon {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      margin-bottom: 18px;
      border-radius: 14px;
      background: #edf2ff;
      color: var(--primary);
      font-size: 20px;
      font-weight: bold;
    }

    .feature:nth-child(2) .feature-icon,
